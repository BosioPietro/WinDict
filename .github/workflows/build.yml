name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo clippy --release --all-targets --features uiaccess -- -D warnings
      # Once in debug too, where overflows and debug assertions panic.
      - run: cargo test
      - run: cargo test --release
      - run: cargo test --release --features uiaccess
      - run: cargo build --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windict
          path: target/release/windict.exe
      # As release.yml does, so a broken setup shows before a release.
      - name: Build the setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/windict.exe dist/WinDict.exe
          Copy-Item target/release/wd.exe dist/wd.exe
          cargo build --release --features uiaccess
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Copy-Item target/release/windict.exe dist/WinDict-uiaccess.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DVersion=$version" installer/windict.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          $env:WINDICT_SETUP = (Resolve-Path "dist/WinDict-v$version-inno.exe").Path
          cargo build --release --features setup --bin windict-setup
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Copy-Item target/release/windict-setup.exe "dist/WinDict-v$version-setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windict-setup
          path: dist/WinDict-v*-setup.exe
