name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo clippy --release --all-targets --features uiaccess -- -D warnings
      - run: cargo test --release
      - run: cargo test --release --features uiaccess
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windict
          path: target/release/windict.exe
      # As release.yml does, so a broken setup shows before a release.
      - name: Build the setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/windict.exe dist/WinDict.exe
          Copy-Item target/release/wd.exe dist/wd.exe
          cargo build --release --features uiaccess
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Copy-Item target/release/windict.exe dist/WinDict-uiaccess.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DVersion=$version" installer/windict.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
          $env:WINDICT_SETUP = (Resolve-Path "dist/WinDict-v$version-inno.exe").Path
          cargo build --release --features setup --bin windict-setup
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Copy-Item target/release/windict-setup.exe "dist/WinDict-v$version-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windict-setup
          path: dist/WinDict-v*-setup.exe
