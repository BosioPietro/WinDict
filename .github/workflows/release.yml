name: release

# Publishes WinDict as a GitHub Release, either by pushing a tag like `v0.2.0`
# or from the Actions tab ("Run workflow", entering the version).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes need the history and tags since the last release.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Name the executable after the version
        shell: pwsh
        run: Copy-Item target/release/windict.exe "WinDict-$env:TAG.exe"
      # The installer, with the variant that can appear above Start; see
      # installer/windict.iss.
      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "WinDict-$env:TAG.exe" dist/WinDict.exe
          Copy-Item target/release/wd.exe dist/wd.exe
          cargo build --release --features uiaccess
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Copy-Item target/release/windict.exe dist/WinDict-uiaccess.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DVersion=$($env:TAG.TrimStart('v'))" installer/windict.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
      # The setup people download, WinGet and "Update app" install with, which
      # carries the installer above and runs it; see src/setup.rs.
      - name: Build the setup
        shell: pwsh
        run: |
          $env:WINDICT_SETUP = (Resolve-Path "dist/WinDict-$env:TAG-inno.exe").Path
          cargo build --release --features setup --bin windict-setup
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          Copy-Item target/release/windict-setup.exe "dist/WinDict-$env:TAG-setup.exe"
      # The features and fixes since the last release; see cliff.toml. Run from
      # the Actions tab, the tag doesn't exist yet, so the commits since the
      # last tag are named after it.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Write the release notes
        shell: pwsh
        run: |
          $range = if (git tag -l $env:TAG) { @('--latest') } else { @('--unreleased', '--tag', $env:TAG) }
          # Not @range: splatting turns `--latest` into `-` and `-latest`.
          git cliff $range --strip all -o notes.md
          if ($LASTEXITCODE -ne 0) { throw 'git cliff failed' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            WinDict-${{ env.TAG }}.exe
            dist/WinDict-${{ env.TAG }}-setup.exe
          body_path: notes.md
