name: release

# Publishes WinDict as a GitHub Release, either by pushing a tag like `v0.2.0`
# or from the Actions tab ("Run workflow", entering the version).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Name the executable after the version
        shell: pwsh
        run: Copy-Item target/release/windict.exe "WinDict-$env:TAG.exe"
      # The variant that can appear above Start; see scripts/install-uiaccess.ps1.
      - run: cargo build --release --features uiaccess
      - shell: pwsh
        run: Copy-Item target/release/windict.exe "WinDict-$env:TAG-uiaccess.exe"
      # The setup WinGet and "Update app" install; see installer/windict.iss.
      - name: Build the setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "WinDict-$env:TAG.exe" dist/WinDict.exe
          Copy-Item "WinDict-$env:TAG-uiaccess.exe" dist/WinDict-uiaccess.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DVersion=$($env:TAG.TrimStart('v'))" installer/windict.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            WinDict-${{ env.TAG }}.exe
            WinDict-${{ env.TAG }}-uiaccess.exe
            dist/WinDict-${{ env.TAG }}-setup.exe
            scripts/install-uiaccess.ps1
            scripts/install-uiaccess-local.ps1
          generate_release_notes: true
