name: release

# Push a tag like `v0.2.0` to build WinDict and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Name the executable after the version
        shell: pwsh
        run: Copy-Item target/release/windict.exe "WinDict-${{ github.ref_name }}.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: WinDict-${{ github.ref_name }}.exe
          generate_release_notes: true
