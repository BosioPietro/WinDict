[package]
name = "windict"
version = "0.22.0"
edition = "2021"
# <[T]>::as_chunks (selection.rs)
rust-version = "1.88"
description = "Tiny always-on Windows dictionary: press a hotkey, see the definition of the selected text."
license = "MIT"

# The tests are the library's: a test build of the executable would carry
# its manifest, and the `uiaccess` one can't start unless installed.
[[bin]]
name = "windict"
path = "src/main.rs"
test = false

[features]
# Builds the variant that can show the card above Start/Search. It must be
# signed and installed with scripts/install-uiaccess.ps1 to run.
uiaccess = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-numerics = "0.3"
miniz_oxide = "0.8"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "Media",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
